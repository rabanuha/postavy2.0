<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css">
</head>
 

<body>
 <h1>bus postavy</h1>

  <!-- Добавляем контейнер для рекламы Яндекса -->
    <div class="top-banner-spacer"></div>

    <!-- Заворачиваем карту в блок, который займет все свободное место -->
    <div class="map-wrapper">
        <div class="map">
            <img class="map-img" src="map.png" alt="">
        </div>
    </div>

 <div class="interactive-block">
 	<img class="bus" src="lunch-removebg-preview.png" alt="автобус">
 	<button class="nearestBus">ближайший транспорт</button>
 </div>

 
 <div class="navigation-menu">
	<div class="navigation-menu-near_stop">
		<img class="navigation-menu-near_stop-icon" src="bus-stop-shelter-isometric-vector_87187-51.avif" alt="Автобусная остановка в изометрии">
	</div>

	<div class="navigation-menu-route">
		<img class="navigation-menu-route-icon" src="qwen-image-2.1-1600290153.png" alt="иконка">
	</div>

	<div class="navigation-menu-scedule">
		<img class="navigation-menu-scedule-icon" src="qwen-image-2.1-1116880962.png" alt="иконка">
	</div>
 </div>
 <script src="script.js"></script>
</body>
</html>
